<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --ink:#14191B; --ink-2:#48565A; --ink-3:#7C8A8E;
  --ground:#F5F7F7; --surface:#FFFFFF; --raise:#ECF0F0; --line:#D5DEDE;
  --accent:#8A6212; --accent-soft:#F4ECDA;
  --live:#A22C22; --live-soft:#F8E6E4;
  --f-sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-serif:"IBM Plex Serif",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E6EDEC; --ink-2:#A6B4B4; --ink-3:#748284;
  --ground:#0D1214; --surface:#141B1D; --raise:#1A2224; --line:#2A3739;
  --accent:#D6A648; --accent-soft:#2A2314;
  --live:#E5817A; --live-soft:#2E1917;
}}
:root[data-theme="dark"]{
  --ink:#E6EDEC; --ink-2:#A6B4B4; --ink-3:#748284;
  --ground:#0D1214; --surface:#141B1D; --raise:#1A2224; --line:#2A3739;
  --accent:#D6A648; --accent-soft:#2A2314;
  --live:#E5817A; --live-soft:#2E1917;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-serif);
  font-size:16px;line-height:1.6}
.wrap{max-width:78rem;margin:0 auto;padding:0 1.25rem 5rem}
h1,h2,h3,h4,.ui{font-family:var(--f-sans)}
.masthead{padding:2.6rem 0 1.1rem;border-bottom:2px solid var(--ink);margin-bottom:1.4rem}
.masthead h1{font-family:var(--f-serif);font-size:clamp(1.9rem,4.5vw,2.9rem);font-weight:600;
  letter-spacing:-.02em;margin:0 0 .5rem;line-height:1.05;text-wrap:balance}
.masthead .sub{color:var(--ink-2);margin:0;max-width:62ch;font-size:1.02rem}
.tallies{display:flex;flex-wrap:wrap;gap:.15rem 1.5rem;padding:.7rem 0 1rem;
  border-bottom:1px solid var(--line);margin-bottom:1.4rem}
.tally{display:flex;align-items:baseline;gap:.35rem}
.tally b{font-family:var(--f-sans);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tally span{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.tally.is-live b{color:var(--live)} .tally.is-you b{color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr;gap:1.6rem}
@media (min-width:70rem){.cols{grid-template-columns:minmax(0,1fr) 19rem}}
h2.grp{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  font-weight:600;margin:2rem 0 .15rem}
h2.grp:first-child{margin-top:0}
.blurb{color:var(--ink-2);font-size:.9rem;margin:.2rem 0 .7rem;max-width:66ch}
.item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:3px;padding:.75rem .85rem;margin:.55rem 0}
.item.sev-live{border-left-color:var(--live)}
.item.sev-high{border-left-color:var(--accent)}
.item.sev-design{border-left-color:var(--ink-3)}
.item.st-done,.item.sev-done{opacity:.6}
.slug{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);display:block}
.item h3{font-family:var(--f-sans);font-size:1rem;font-weight:600;margin:.12rem 0 .35rem;
  line-height:1.35}
.chips{display:inline-flex;gap:.3rem;margin-left:.4rem;vertical-align:middle}
.chip{font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;
  padding:.08rem .38rem;border-radius:2px;background:var(--raise);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap}
.chip-you{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.why{margin:.3rem 0;font-size:.95rem}
ul.ev{margin:.45rem 0;padding-left:1.05rem;font-family:var(--f-mono);font-size:.78rem;
  color:var(--ink-2)}
ul.ev li{margin:.14rem 0;word-break:break-word}
dl.meta{display:grid;grid-template-columns:max-content 1fr;gap:.12rem .7rem;margin:.45rem 0 .2rem;
  font-size:.86rem}
dl.meta dt{font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);padding-top:.22rem}
dl.meta dd{margin:0}
details{margin:.4rem 0}
summary{cursor:pointer;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-3)}
summary:hover{color:var(--ink-2)}
details ul,details ol{margin:.4rem 0;padding-left:1.05rem;font-size:.85rem}
.project-first{background:var(--accent-soft);color:var(--accent);border-radius:2px;
  padding:.35rem .5rem;font-size:.82rem;margin:.4rem 0}
.log li{margin:.35rem 0}
.byline{display:block;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3)}
.q{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:3px;padding:.75rem .85rem;margin:.55rem 0}
.q h3{font-family:var(--f-sans);font-size:.98rem;margin:0 0 .3rem}
.q .why{font-size:.9rem;color:var(--ink-2)}
.opts{list-style:none;margin:.45rem 0;padding:0}
.opts li{font-family:var(--f-mono);font-size:.78rem;padding:.2rem .45rem;border-left:2px solid transparent;
  color:var(--ink-2)}
.opts li.is-rec{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent);
  font-weight:500}
aside.map{align-self:start}
@media (min-width:70rem){aside.map{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto}}
.cluster{margin:0 0 1rem}
.cluster h3{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);margin:0 0 .3rem}
.edge{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin:.2rem 0;font-size:.76rem}
.edge .n{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);text-decoration:none;
  border-bottom:1px dotted var(--line)}
.edge .n:hover{color:var(--ink);border-bottom-color:var(--ink)}
.edge .rel{font-family:var(--f-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:.6rem .75rem;
  margin:.5rem 0}
.panel summary{font-size:.7rem}
table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:.74rem;margin-top:.5rem}
th,td{text-align:left;padding:.25rem .45rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.empty{color:var(--ink-3);font-style:italic;font-size:.88rem}
.legend{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3);margin:.2rem 0 .8rem}
footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);
  font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);line-height:1.8}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<header class="masthead">
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
</header>

<div class="tallies">{{TALLIES}}</div>

{{PANELS}}

{{QUESTIONS}}

<div class="cols">
  <main>{{BODY}}</main>
  {{MAP}}
</div>

<footer>{{FOOTER}}</footer>
</div>

<script>
// Per-viewer state only: which sections you opened. Never part of the record.
(function () {
  var KEY = "workboard-open";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  var open = load();
  document.querySelectorAll("details[data-k]").forEach(function (d) {
    if (open[d.dataset.k]) d.open = true;
    d.addEventListener("toggle", function () {
      if (d.open) open[d.dataset.k] = 1; else delete open[d.dataset.k];
      save(open);
    });
  });
}());
</script>
